<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Canales TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .filters {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        select {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .stats {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            border-color: var(--accent-color);
        }

        .logo-container {
            width: 100%;
            height: 140px;
            background-color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .card-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: auto;
            margin-bottom: 1rem;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-country {
            background-color: #1e3a8a;
            color: #93c5fd;
        }

        .tag-genre {
            background-color: #312e81;
            color: #c4b5fd;
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>

            <div class="search-box">

                </select>
            </div>
        </div>

        <div class="stats" id="statsCount">Cargando canales...</div>

        <div class="grid" id="channelsGrid"></div>
    </div>

        const grid = document.getElementById('channelsGrid');
        const searchInput = document.getElementById('searchInput');
        const countryFilter = document.getElementById('countryFilter');
        const genreFilter = document.getElementById('genreFilter');
        const statsCount = document.getElementById('statsCount');

        // Populate filter dropdowns
        function initFilters() {
            const countries = [...new Set(channels.map(c => c.country))].sort();
            const genres = [...new Set(channels.map(c => c.genre))].sort();

            countries.forEach(c => {
                if (c) {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    countryFilter.appendChild(opt);
                }
            });

            genres.forEach(g => {
                if (g) {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    genreFilter.appendChild(opt);
                }
            });
        }

        function renderChannels(filtered) {
            grid.innerHTML = '';
            statsCount.textContent = `Mostrando ${filtered.length} de ${channels.length} canales`;

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">No se encontraron canales con los filtros seleccionados.</div>';
                return;
            }

            filtered.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const logoSrc = c.logo ? c.logo : 'https://via.placeholder.com/150?text=No+Logo';
                
                card.innerHTML = `
                    <div class="logo-container">
                        <img src="${logoSrc}" alt="${c.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Sin+Logo';">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${c.name}</div>
                        <div class="card-tags">
                            <span class="tag tag-country">${c.country}</span>
                            <span class="tag tag-genre">${c.genre}</span>
                        </div>
                        <a href="${c.url}" target="_blank" class="play-btn">Reproducir Stream</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterData() {
            const query = searchInput.value.toLowerCase();
            const selectedCountry = countryFilter.value;
            const selectedGenre = genreFilter.value;

            const filtered = channels.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(query);
                const matchesCountry = selectedCountry === '' || c.country === selectedCountry;
                const matchesGenre = selectedGenre === '' || c.genre === selectedGenre;
                return matchesSearch && matchesCountry && matchesGenre;
            });

            renderChannels(filtered);
        }

        searchInput.addEventListener('input', filterData);
        countryFilter.addEventListener('change', filterData);
        genreFilter.addEventListener('change', filterData);

        // Initial setup
        initFilters();
        renderChannels(channels);
    </script>
